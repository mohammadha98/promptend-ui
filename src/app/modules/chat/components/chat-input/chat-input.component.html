<form class="flex items-end gap-4 p-6 bg-white dark:bg-neutral-900 border-t border-neutral-200 dark:border-neutral-700" (ngSubmit)="onSubmit()">
    <div class="relative flex-1">
        <textarea [(ngModel)]="message" name="message" placeholder="Type your message..." class="input-field w-full p-4 pr-20 resize-none
       max-h-48 overflow-y-auto text-base leading-relaxed"></textarea>

        <div class="absolute right-4 bottom-4 flex items-center gap-3">
            <button type="button" class="text-secondary-500 hover:text-secondary-600 transition-colors duration-200"
                title="Toggle expanded view">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path x-show="!isExpanded" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                    <path x-show="isExpanded" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 9l-7 7-7-7" />
                </svg>
            </button>
            <kbd class="px-2 py-1 bg-neutral-200 dark:bg-neutral-700 text-neutral-700 dark:text-neutral-300 rounded-md text-xs font-medium hidden sm:inline-block">⌘ + Enter</kbd>
        </div>
    </div>
    <button type="submit" class="btn-primary p-4 active:scale-95 transition-all duration-200
     flex items-center justify-center shadow-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
    </button>
</form>
