<form class="flex items-center gap-2" (ngSubmit)="onSubmit()">
    <div class="relative flex-1">
        <textarea [(ngModel)]="message" name="message" placeholder="Type your message..." class="w-full p-3 pr-16 bg-gray-800 rounded-xl border border-gray-700 resize-none
       focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm scrollbar-hide
       transition-all duration-200 max-h-48 overflow-y-auto"></textarea>

        <div class="absolute right-3 bottom-3 flex items-center gap-2">
            <button type="button" class="text-gray-400 hover:text-white transition-colors"
                title="Toggle expanded view">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path x-show="!isExpanded" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                    <path x-show="isExpanded" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 9l-7 7-7-7" />
                </svg>
            </button>
            <kbd class="px-2 py-1 bg-gray-700 rounded-md text-xs hidden sm:inline-block">⌘ + Enter</kbd>
        </div>
    </div>
    <button type="submit" class="p-3 bg-blue-600 rounded-xl hover:bg-blue-700 active:scale-95 transition-all
     flex items-center justify-center shadow-lg hover:shadow-blue-500/20">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
    </button>
</form>
