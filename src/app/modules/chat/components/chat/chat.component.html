<div class="flex h-screen overflow-hidden bg-neutral-100 dark:bg-neutral-900">
  <!-- Sidebar -->
  <aside class="w-72 flex-shrink-0 bg-neutral-50 dark:bg-neutral-800 overflow-y-auto border-r border-neutral-200 dark:border-neutral-700">
    <chat-lists></chat-lists>
  </aside>

  <!-- Main Content Area -->
  <section class="flex-1 flex flex-col bg-white dark:bg-neutral-900 overflow-hidden">
    <!-- Header -->
    <header class="flex-shrink-0 h-16 bg-white dark:bg-neutral-900 border-b border-neutral-200 dark:border-neutral-700 shadow-sm z-10">
      <app-chat-header (toggleSidebar)="toggleSidebar($event)"></app-chat-header>
    </header>

    <!-- Chat Messages -->
    <main class="flex-1 overflow-y-auto p-4">
      <app-message-list [messages]="messages()" [conversationId]="currentConversationId"></app-message-list>
    </main>

    <!-- Composer -->
    <footer class="flex-shrink-0 bg-white dark:bg-neutral-900 border-t border-neutral-200 dark:border-neutral-700 p-4">
      <app-chat-input (sendMessage)="handleSendMessage($event)"></app-chat-input>
    </footer>
  </section>

  <!-- Right Sidebar -->
  <aside class="w-72 flex-shrink-0 bg-neutral-50 dark:bg-neutral-800 overflow-y-auto border-l border-neutral-200 dark:border-neutral-700">
    <chat-sidebar></chat-sidebar>
  </aside>
</div>
