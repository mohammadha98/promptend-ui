<!-- Header -->
<div class="p-6 border-b border-neutral-200 dark:border-neutral-700">
  <h2 class="text-xl font-bold text-neutral-800 dark:text-neutral-200 flex items-center gap-3">
    <svg class="w-5 h-5 text-secondary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
    Chat History
  </h2>
</div>


<!-- Rest of chat history items -->
<div class="flex-1 h-full overflow-y-auto p-4 space-y-4" >
  @for(item of chatHistory();track $index){
  <div class="group relative card p-6 hover:bg-neutral-50 dark:hover:bg-neutral-700 transition-colors duration-200"
    (mouseenter)="toggleBranchVisibility(item, true)" (mouseleave)="toggleBranchVisibility(item, false)">
    <div class="flex items-center justify-between cursor-pointer">
      <div class="flex-1 truncate">
        <span class="text-base font-medium text-neutral-800 dark:text-neutral-200">{{ item.title }}</span>
        <div class="flex items-center gap-2 mt-2">
          <span class="text-xs px-2 py-1 bg-neutral-200 dark:bg-neutral-600 text-neutral-700 dark:text-neutral-300 rounded-md font-medium">{{ item.branches }} branches</span>
          <span class="text-xs font-medium" [ngClass]="{'text-success-500': item.status === 'active', 'text-neutral-500': item.status === 'inactive'}">
            {{ item.status }}
          </span>
        </div>
      </div>
      <button aria-label="Toggle branch visibility" class="p-1 text-secondary-500 hover:text-secondary-600 transform transition-all duration-200"
        [ngClass]="{ 'rotate-180': item.isOpen }">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
    </div>

    <!-- Nested Branches with Animation -->
    <div class="ml-6 mt-4 space-y-2 overflow-hidden transition-all duration-300"
      [ngClass]="item.isOpen ? 'max-h-96 opacity-100' : 'max-h-0 opacity-0'">
      @for(branch of item.branchesDetails;track $index){
      <div class="flex items-center p-3 text-sm hover:bg-neutral-100 dark:hover:bg-neutral-600 rounded-lg cursor-pointer transition-colors duration-200"
        [ngClass]="{'border-l-4': true, 'border-primary-500 hover:border-primary-400': branch.color === 'blue', 'border-secondary-500 hover:border-secondary-400': branch.color === 'purple', 'border-success-500 hover:border-success-400': branch.color === 'green'}">
        <span class="w-3 h-3 rounded-full mr-3" [ngClass]="{'bg-primary-500': branch.color === 'blue', 'bg-secondary-500': branch.color === 'purple', 'bg-success-500': branch.color === 'green'}"></span>
        <span class="font-medium text-neutral-800 dark:text-neutral-200">{{ branch.name }}</span>
        <span class="ml-auto text-xs text-neutral-500 dark:text-neutral-400">{{ branch.timeAgo }}</span>
      </div>
      }
      <button class="w-full p-3 text-sm text-neutral-600 dark:text-neutral-400 hover:text-neutral-800 dark:hover:text-neutral-200 flex items-center transition-colors duration-200 hover:bg-neutral-100 dark:hover:bg-neutral-600 rounded-lg">
        <svg class="w-4 h-4 mr-2 text-secondary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
        </svg>
        New Branch
      </button>
    </div>
  </div>
  }

</div>
