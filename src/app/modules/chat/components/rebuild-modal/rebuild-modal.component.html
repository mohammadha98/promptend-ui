<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
  <!-- Modal Container -->
  <div class="bg-white dark:bg-neutral-800 rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-hidden">
    <!-- Modal Header -->
    <div class="px-6 py-4 border-b border-neutral-200 dark:border-neutral-700">
      <h2 class="text-xl font-semibold text-neutral-900 dark:text-neutral-100">
        Conversation Rebuild
      </h2>
      <p class="text-sm text-neutral-600 dark:text-neutral-400 mt-1">
        Edit Your Prompt And Rebuild Entire Conversation From This Point
      </p>
    </div>

    <!-- Modal Body -->
    <div class="px-6 py-4">
      <!-- Textarea for editing prompt -->
      <div class="mb-4">
        <label for="prompt-textarea" class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-2">
          Prompt Content :
        </label>
        <textarea
          id="prompt-textarea"
          [value]="editedPrompt()"
          (input)="onPromptChange($event)"
          class="w-full h-32 px-3 py-2 border border-neutral-300 dark:border-neutral-600 rounded-lg 
                 bg-white dark:bg-neutral-700 text-neutral-900 dark:text-neutral-100
                 focus:ring-2 focus:ring-blue-500 focus:border-transparent
                 resize-none transition-colors duration-200"
          placeholder="Enter You Prompt..."
          [disabled]="isLoading()"
        ></textarea>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMsg()" class="mb-4 p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg">
        <p class="text-sm text-red-600 dark:text-red-400">
          {{ errorMsg() }}
        </p>
      </div>

      <!-- Token Limit Warning -->
      <div class="mb-4 p-3 bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-800 rounded-lg">
        <p class="text-sm text-yellow-700 dark:text-yellow-300">
          <svg class="w-4 h-4 inline-block ml-1" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
          </svg>
          Note: Rebuilding a conversation may take time and has token limitations.
        </p>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="px-6 py-4 border-t border-neutral-200 dark:border-neutral-700 flex justify-end gap-3">
      <!-- Cancel Button -->
      <button
        type="button"
        (click)="onCancel()"
        [disabled]="isLoading()"
        class="px-4 py-2 text-sm font-medium text-neutral-700 dark:text-neutral-300
               bg-white dark:bg-neutral-700 border border-neutral-300 dark:border-neutral-600
               rounded-lg hover:bg-neutral-50 dark:hover:bg-neutral-600
               focus:ring-2 focus:ring-offset-2 focus:ring-blue-500
               disabled:opacity-50 disabled:cursor-not-allowed
               transition-colors duration-200"
      >
        Dismiss
      </button>

      <!-- Apply Button -->
      <button
        type="button"
     
        [disabled]="isLoading() || !editedPrompt().trim()"
        class="px-4 py-2 text-sm font-medium text-white
               bg-green-600 hover:bg-green-700 disabled:bg-green-400
               rounded-lg focus:ring-2 focus:ring-offset-2 focus:ring-green-500
               disabled:cursor-not-allowed flex items-center gap-2
               transition-colors duration-200"
      >
        <!-- Apply Icon -->
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        Apply
      </button>

      <!-- Rebuild Button -->
      <button
        type="button"
        (click)="onRebuild()"
        [disabled]="isLoading() || !editedPrompt().trim()"
        class="px-4 py-2 text-sm font-medium text-white
               bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400
               rounded-lg focus:ring-2 focus:ring-offset-2 focus:ring-blue-500
               disabled:cursor-not-allowed flex items-center gap-2
               transition-colors duration-200"
      >
        <!-- Loading Spinner -->
        <svg *ngIf="isLoading()" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        
        <!-- Rebuild Icon -->
        <svg *ngIf="!isLoading()" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        
        {{ isLoading() ? 'Rebuilding...' : 'Rebuild' }}
      </button>
    </div>
  </div>
</div>
