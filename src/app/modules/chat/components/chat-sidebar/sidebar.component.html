<div class="h-full bg-neutral-50 dark:bg-neutral-800 border-r border-neutral-200 dark:border-neutral-700 overflow-y-auto">
  <div class="space-y-4 p-3">

    <div class="group">
      <div class="card p-3 cursor-pointer hover:bg-neutral-50 dark:hover:bg-neutral-700 transition-colors duration-200" role="button"
        [attr.aria-expanded]="isModelSectionExpanded" [attr.aria-controls]="'model-section'"
        (click)="toggleModelSection()">
        <div class="flex items-center justify-between gap-1">
          <h3 class="text-sm font-semibold text-neutral-800 dark:text-neutral-200 uppercase tracking-wide truncate">AI Model</h3>
          <svg class="w-4 h-4 text-secondary-500 transform transition-transform duration-150 flex-shrink-0"
            [ngClass]="{'rotate-180': isModelSectionExpanded}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
          </svg>
        </div>
      </div>
      <div id="model-section" class="overflow-hidden transition-all duration-300 ease-in-out"
        [ngClass]="{'max-h-0 opacity-0': !isModelSectionExpanded, 'max-h-screen opacity-100': isModelSectionExpanded}">
        <!-- Model Selection Section -->
        <div class="mt-2 card p-3 space-y-2 divide-y divide-neutral-200 dark:divide-neutral-700">
          <label class="flex items-center gap-2 p-2 hover:bg-neutral-100 dark:hover:bg-neutral-700 rounded cursor-pointer transition-colors duration-200"
            aria-label="ChatGPT model">
            <input type="radio" name="llm-model" class="w-3 h-3 text-primary-500 border-neutral-300 dark:border-neutral-600 focus:ring-primary-500" checked>
            <svg class="w-4 h-4 text-success-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
            <span class="text-xs font-medium text-neutral-800 dark:text-neutral-200 truncate">ChatGPT-4o</span>
            <span class="ml-auto text-xs px-1.5 py-0.5 bg-success-500 text-white rounded font-medium text-[10px] flex-shrink-0">Active</span>
          </label>

          <label class="flex items-center gap-2 p-2 hover:bg-neutral-100 dark:hover:bg-neutral-700 rounded cursor-pointer transition-colors duration-200"
            aria-label="Claude model">
            <input type="radio" name="llm-model" class="w-3 h-3 text-primary-500 border-neutral-300 dark:border-neutral-600 focus:ring-primary-500">
            <svg class="w-4 h-4 text-secondary-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span class="text-xs font-medium text-neutral-800 dark:text-neutral-200 truncate">Claude 3.5</span>
          </label>

          <label class="flex items-center gap-2 p-2 hover:bg-neutral-100 dark:hover:bg-neutral-700 rounded cursor-pointer transition-colors duration-200"
            aria-label="Gemini model">
            <input type="radio" name="llm-model" class="w-3 h-3 text-primary-500 border-neutral-300 dark:border-neutral-600 focus:ring-primary-500">
            <svg class="w-4 h-4 text-primary-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12h-6m6 0l-3-3m3 3l-3 3" />
            </svg>
            <span class="text-xs font-medium text-neutral-800 dark:text-neutral-200 truncate">Gemini Pro</span>
            <span class="ml-auto text-xs px-1.5 py-0.5 bg-warning-500 text-white rounded font-medium text-[10px] flex-shrink-0">Beta</span>
          </label>

          <button class="w-full mt-6 px-4 py-3 text-sm font-medium rounded-lg transition-all duration-200 ease-in-out 
            bg-neutral-200 dark:bg-neutral-700 text-neutral-700 dark:text-neutral-300
            hover:bg-neutral-300 dark:hover:bg-neutral-600 
            hover:shadow-md focus:ring-2 focus:ring-offset-2 focus:ring-secondary-500
            active:scale-95 flex items-center justify-center gap-2" aria-label="Add custom model">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
            </svg>
            Custom Model...
          </button>
        </div>
      </div>
    </div>

    <!-- Rebuild Modes Section -->
    <div class="group">
      <div class="card p-3 cursor-pointer hover:bg-neutral-50 dark:hover:bg-neutral-700 transition-colors duration-200" role="button"
        [attr.aria-expanded]="isRebuildSectionExpanded" [attr.aria-controls]="'rebuild-section'"
        (click)="toggleRebuildSection()">
        <div class="flex items-center justify-between gap-1">
          <h3 class="text-sm font-semibold text-neutral-800 dark:text-neutral-200 uppercase tracking-wide truncate">Rebuild Modes</h3>
          <svg class="w-4 h-4 text-secondary-500 transform transition-transform duration-150 flex-shrink-0"
            [ngClass]="{'rotate-180': isRebuildSectionExpanded}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
          </svg>
        </div>
      </div>
      <div id="rebuild-section" class="overflow-hidden transition-all duration-300 ease-in-out"
        [ngClass]="{'max-h-0 opacity-0': !isRebuildSectionExpanded, 'max-h-screen opacity-100': isRebuildSectionExpanded}">
        <div class="mt-2 card p-3 space-y-2 divide-y divide-neutral-200 dark:divide-neutral-700">
          <label class="flex items-center gap-2 p-2 hover:bg-neutral-100 dark:hover:bg-neutral-700 rounded cursor-pointer transition-colors duration-200">
            <input type="radio" name="rebuild-mode" class="w-3 h-3 text-primary-500 border-neutral-300 dark:border-neutral-600 focus:ring-primary-500" checked>
            <span class="text-xs font-medium text-neutral-800 dark:text-neutral-200 truncate">Manual Edit</span>
          </label>
          <label class="flex items-center gap-2 p-2 hover:bg-neutral-100 dark:hover:bg-neutral-700 rounded cursor-pointer transition-colors duration-200">
            <input type="radio" name="rebuild-mode" class="w-3 h-3 text-primary-500 border-neutral-300 dark:border-neutral-600 focus:ring-primary-500">
            <span class="text-xs font-medium text-neutral-800 dark:text-neutral-200 truncate">Auto-Optimize</span>
            <span class="ml-auto text-xs px-1.5 py-0.5 bg-secondary-500 text-white rounded font-medium text-[10px] flex-shrink-0">Beta</span>
          </label>
          <label class="flex items-center gap-2 p-2 hover:bg-neutral-100 dark:hover:bg-neutral-700 rounded cursor-pointer transition-colors duration-200">
            <input type="radio" name="rebuild-mode" class="w-3 h-3 text-primary-500 border-neutral-300 dark:border-neutral-600 focus:ring-primary-500">
            <span class="text-xs font-medium text-neutral-800 dark:text-neutral-200 truncate">Branch Preview</span>
          </label>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="card p-3 cursor-pointer hover:bg-neutral-50 dark:hover:bg-neutral-700 transition-colors duration-200" role="button"
        [attr.aria-expanded]="isOptimizationSectionExpanded" [attr.aria-controls]="'optimization-section'"
        (click)="toggleOptimizationSection()">
        <div class="flex items-center justify-between gap-1">
          <h3 class="text-sm font-semibold text-neutral-800 dark:text-neutral-200 uppercase tracking-wide truncate">Optimization Settings</h3>
          <svg class="w-4 h-4 text-secondary-500 transform transition-transform duration-150 flex-shrink-0"
            [ngClass]="{'rotate-180': isOptimizationSectionExpanded}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
          </svg>
        </div>
      </div>
      <div id="optimization-section" class="overflow-hidden transition-all duration-300 ease-in-out"
        [ngClass]="{'max-h-0 opacity-0': !isOptimizationSectionExpanded, 'max-h-screen opacity-100': isOptimizationSectionExpanded}">
        <div class="mt-2 card p-3 space-y-4">
          <div class="flex items-center justify-between">
            <span class="text-xs font-medium text-neutral-700 dark:text-neutral-300">Aggressiveness</span>
            <select class="input-field min-w-0 w-28 text-xs py-1" 
                    [value]="aggressiveness()" 
                    (change)="setAggressiveness($any($event.target).value)">
              <option value="conservative">Conservative</option>
              <option value="balanced">Balanced</option>
              <option value="aggressive">Aggressive</option>
            </select>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-xs font-medium text-neutral-700 dark:text-neutral-300">Preserve Intent</span>
            <input type="checkbox" 
                     class="w-3 h-3 text-primary-500 border-neutral-300 dark:border-neutral-600 rounded focus:ring-primary-500"
                     [checked]="preserveIntent()" 
                     (change)="setPreserveIntent($any($event.target).checked)">
          </div>
          
          <!-- Progress indicator -->
          <div *ngIf="isRebuilding()" class="mb-4">
            <div class="flex items-center justify-between text-sm text-neutral-600 dark:text-neutral-400 mb-2">
              <span>Rebuilding conversation...</span>
              <span *ngIf="rebuildProgress()" class="font-medium">
                {{rebuildProgress()().current}}/{{rebuildProgress()().total}}
              </span>
            </div>
            <div class="w-full bg-neutral-200 dark:bg-neutral-700 rounded-full h-2">
              <div class="bg-primary-500 h-2 rounded-full transition-all duration-300" 
                   [style.width.%]="rebuildProgress() ? (rebuildProgress()().current / rebuildProgress()().total) * 100 : 0">
              </div>
            </div>
          </div>
          
          <!-- Rebuild button -->
    
          
          <!-- User messages info -->
          <div *ngIf="conversationId" class="text-xs text-neutral-500 dark:text-neutral-400 text-center">
            {{userMessagesCount}} user message(s) in conversation
          </div>
        </div>
          
      </div>
         
    </div>
 <button class="special-button w-full relative text-xs py-1.5 px-3 rounded shadow-sm"
                   [disabled]="!canRebuild"
                   [ngClass]="{
                    'opacity-50 cursor-not-allowed': !canRebuild,
                    'bg-warning-500 hover:bg-warning-600': isRebuilding()
                  }"
                  (click)="isRebuilding() ? onCancelRebuild() : onRebuildClick()">
            <span *ngIf="!isRebuilding()" class="flex items-center justify-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              {{rebuildButtonText}}
            </span>
            <span *ngIf="isRebuilding()" class="flex items-center justify-center gap-2">
              <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              Cancel Rebuild
            </span>
          </button>
  </div>
</div>
