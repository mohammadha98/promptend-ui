<div class="h-full bg-neutral-50 dark:bg-neutral-800 border-r border-neutral-200 dark:border-neutral-700 overflow-y-auto">
  <div class="space-y-6 p-4">

    <div class="group">
      <div class="card p-6 cursor-pointer hover:bg-neutral-50 dark:hover:bg-neutral-700 transition-colors duration-200" role="button"
        [attr.aria-expanded]="isModelSectionExpanded" [attr.aria-controls]="'model-section'"
        (click)="toggleModelSection()">
        <div class="flex items-center justify-between gap-2">
          <h3 class="text-lg font-semibold text-neutral-800 dark:text-neutral-200 uppercase tracking-wide">AI Model</h3>
          <svg class="w-5 h-5 text-secondary-500 transform transition-transform duration-150"
            [ngClass]="{'rotate-180': isModelSectionExpanded}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
          </svg>
        </div>
      </div>
      <div id="model-section" class="overflow-hidden transition-all duration-300 ease-in-out"
        [ngClass]="{'max-h-0 opacity-0': !isModelSectionExpanded, 'max-h-screen opacity-100': isModelSectionExpanded}">
        <!-- Model Selection Section -->
        <div class="mt-4 card p-6 space-y-4 divide-y divide-neutral-200 dark:divide-neutral-700">
          <label class="flex items-center gap-3 p-3 hover:bg-neutral-100 dark:hover:bg-neutral-700 rounded-lg cursor-pointer transition-colors duration-200"
            aria-label="ChatGPT model">
            <input type="radio" name="llm-model" class="w-4 h-4 text-primary-500 border-neutral-300 dark:border-neutral-600 focus:ring-primary-500" checked>
            <svg class="w-5 h-5 text-success-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
            <span class="text-sm font-medium text-neutral-800 dark:text-neutral-200">ChatGPT-4o</span>
            <span class="ml-auto text-xs px-2 py-1 bg-success-500 text-white rounded-md font-medium">Active</span>
          </label>

          <label class="flex items-center gap-3 p-3 hover:bg-neutral-100 dark:hover:bg-neutral-700 rounded-lg cursor-pointer transition-colors duration-200 pt-6"
            aria-label="Claude model">
            <input type="radio" name="llm-model" class="w-4 h-4 text-primary-500 border-neutral-300 dark:border-neutral-600 focus:ring-primary-500">
            <svg class="w-5 h-5 text-secondary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span class="text-sm font-medium text-neutral-800 dark:text-neutral-200">Claude 3.5</span>
          </label>

          <label class="flex items-center gap-3 p-3 hover:bg-neutral-100 dark:hover:bg-neutral-700 rounded-lg cursor-pointer transition-colors duration-200 pt-6"
            aria-label="Gemini model">
            <input type="radio" name="llm-model" class="w-4 h-4 text-primary-500 border-neutral-300 dark:border-neutral-600 focus:ring-primary-500">
            <svg class="w-5 h-5 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12h-6m6 0l-3-3m3 3l-3 3" />
            </svg>
            <span class="text-sm font-medium text-neutral-800 dark:text-neutral-200">Gemini Pro</span>
            <span class="ml-auto text-xs px-2 py-1 bg-warning-500 text-white rounded-md font-medium">Beta</span>
          </label>

          <button class="w-full mt-6 px-4 py-3 text-sm font-medium rounded-lg transition-all duration-200 ease-in-out 
            bg-neutral-200 dark:bg-neutral-700 text-neutral-700 dark:text-neutral-300
            hover:bg-neutral-300 dark:hover:bg-neutral-600 
            hover:shadow-md focus:ring-2 focus:ring-offset-2 focus:ring-secondary-500
            active:scale-95 flex items-center justify-center gap-2" aria-label="Add custom model">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
            </svg>
            Custom Model...
          </button>
        </div>
      </div>
    </div>

    <!-- Rebuild Modes Section -->
    <div class="group">
      <div class="card p-6 cursor-pointer hover:bg-neutral-50 dark:hover:bg-neutral-700 transition-colors duration-200" role="button"
        [attr.aria-expanded]="isRebuildSectionExpanded" [attr.aria-controls]="'rebuild-section'"
        (click)="toggleRebuildSection()">
        <div class="flex items-center justify-between gap-2">
          <h3 class="text-lg font-semibold text-neutral-800 dark:text-neutral-200 uppercase tracking-wide">Rebuild Modes</h3>
          <svg class="w-5 h-5 text-secondary-500 transform transition-transform duration-150"
            [ngClass]="{'rotate-180': isRebuildSectionExpanded}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
          </svg>
        </div>
      </div>
      <div id="rebuild-section" class="overflow-hidden transition-all duration-300 ease-in-out"
        [ngClass]="{'max-h-0 opacity-0': !isRebuildSectionExpanded, 'max-h-screen opacity-100': isRebuildSectionExpanded}">
        <div class="mt-4 card p-6 space-y-4">
          <label class="flex items-center gap-3 p-3 hover:bg-neutral-100 dark:hover:bg-neutral-700 rounded-lg cursor-pointer transition-colors duration-200">
            <input type="radio" name="rebuild-mode" class="w-4 h-4 text-primary-500 border-neutral-300 dark:border-neutral-600 focus:ring-primary-500" checked>
            <span class="text-sm font-medium text-neutral-800 dark:text-neutral-200">Manual Edit</span>
          </label>
          <label class="flex items-center gap-3 p-3 hover:bg-neutral-100 dark:hover:bg-neutral-700 rounded-lg cursor-pointer transition-colors duration-200">
            <input type="radio" name="rebuild-mode" class="w-4 h-4 text-primary-500 border-neutral-300 dark:border-neutral-600 focus:ring-primary-500">
            <span class="text-sm font-medium text-neutral-800 dark:text-neutral-200">Auto-Optimize</span>
            <span class="ml-auto text-xs px-2 py-1 bg-secondary-500 text-white rounded-md font-medium">Beta</span>
          </label>
          <label class="flex items-center gap-3 p-3 hover:bg-neutral-100 dark:hover:bg-neutral-700 rounded-lg cursor-pointer transition-colors duration-200">
            <input type="radio" name="rebuild-mode" class="w-4 h-4 text-primary-500 border-neutral-300 dark:border-neutral-600 focus:ring-primary-500">
            <span class="text-sm font-medium text-neutral-800 dark:text-neutral-200">Branch Preview</span>
          </label>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="card p-6">
        <h3 class="text-lg font-semibold text-neutral-800 dark:text-neutral-200 uppercase tracking-wide mb-6">Optimization Settings</h3>
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <span class="text-sm font-medium text-neutral-700 dark:text-neutral-300">Aggressiveness</span>
            <select class="input-field min-w-0 w-32">
              <option>Conservative</option>
              <option>Balanced</option>
              <option>Aggressive</option>
            </select>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-sm font-medium text-neutral-700 dark:text-neutral-300">Preserve Intent</span>
            <input type="checkbox" class="w-4 h-4 text-primary-500 border-neutral-300 dark:border-neutral-600 rounded focus:ring-primary-500">
          </div>
          <button class="special-button">
            Apply Optimization to Entire Thread
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
