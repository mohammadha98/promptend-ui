<!-- User Message -->
<div *ngIf="messageType() === 'user'" class="flex justify-end pt-4">
  <div class="max-w-[min(80%,48rem)] bg-primary-50 dark:bg-primary-800 text-primary-700 dark:text-primary-200 p-6 rounded-lg shadow-sm group hover:shadow-md transition-shadow duration-200">
    <p class="text-base leading-relaxed">{{ content() }}</p>
    <div class="mt-3 flex items-center justify-between">
      <div class="flex items-center gap-2 text-sm opacity-75">
        <span>Tokens: {{ userTokens() }}</span>
        <span>•</span>
        <span>{{ model() }}</span>
      </div>
      <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
        <button (click)="onRebuildMessage()" class="p-1.5 hover:bg-primary-100 dark:hover:bg-primary-700 rounded-lg transition-colors duration-200 group focus:ring-2 focus:ring-offset-1 focus:ring-primary-500" aria-label="Rebuild conversation from here" title="Rebuild conversation from this message">
          <svg class="w-3.5 h-3.5 text-primary-600 dark:text-primary-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- AI Response -->
<div *ngIf="messageType() === 'ai'" class="flex justify-start pt-4">
  <div class="max-w-[min(80%,48rem)] bg-neutral-100 dark:bg-neutral-700 text-neutral-800 dark:text-neutral-200 p-6 rounded-lg shadow-sm group hover:shadow-md transition-shadow duration-200">
    <p class="text-base leading-relaxed">{{ content() }}</p>
    <div class="mt-4 flex gap-2 opacity-60 group-hover:opacity-100 transition-opacity duration-200">
      <button class="p-2 hover:bg-neutral-200 dark:hover:bg-neutral-600 rounded-lg transition-colors duration-200 group focus:ring-2 focus:ring-offset-1 focus:ring-secondary-500" aria-label="Copy response" title="Copy response">
        <svg class="w-4 h-4 text-secondary-500 group-hover:text-secondary-600 transition-colors duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
      </button>

      <button class="p-2 hover:bg-neutral-200 dark:hover:bg-neutral-600 rounded-lg transition-colors duration-200 group focus:ring-2 focus:ring-offset-1 focus:ring-secondary-500" aria-label="Regenerate response" title="Regenerate this response">
        <svg class="w-4 h-4 text-secondary-500 group-hover:text-secondary-600 transition-colors duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>

      <button (click)="onRebuildMessage()" class="p-2 hover:bg-orange-100 dark:hover:bg-orange-900/30 rounded-lg transition-colors duration-200 group focus:ring-2 focus:ring-offset-1 focus:ring-orange-500" aria-label="Rebuild conversation" title="Rebuild conversation from this point">
        <svg class="w-4 h-4 text-orange-600 dark:text-orange-400 group-hover:text-orange-700 dark:group-hover:text-orange-300 transition-colors duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
    </div>
  </div>
</div>
