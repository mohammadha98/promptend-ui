<!-- Message Component -->
<div [ngClass]="{'flex items-start space-x-1 mb-2': type === 'received', 'flex justify-end mb-2': type === 'sent'}">
    <div [ngClass]="{'bg-gray-700': type === 'received', 'bg-gray-500': type === 'sent'}" class="text-gray-200 px-3 py-2 rounded-md max-w-[14rem] shadow-sm text-xs">
        {{ content }}
    </div>
</div>
