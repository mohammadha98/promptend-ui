<header class="flex items-center justify-between p-6 border-b border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-900 shadow-md">
    <h1 class="text-xl font-semibold text-neutral-800 dark:text-neutral-200">Current Session</h1>
    <div class="flex items-center gap-4">
        <button class="btn-secondary">
            Save State
        </button>
        <button class="btn-primary">
            Export
        </button>
        <button (click)="onToggleSidebar()" class="rounded-lg p-2 bg-neutral-100 dark:bg-neutral-800 hover:bg-neutral-200 dark:hover:bg-neutral-700 transition-colors duration-200 ease-in-out shadow-sm flex items-center justify-center focus:ring-2 focus:ring-offset-2 focus:ring-secondary-500">
            <svg class="w-5 h-5 text-secondary-500 transition-transform duration-150" fill="none" stroke="currentColor"
            viewBox="0 0 24 24" [ngClass]="{'rotate-180': !isSidebarVisible}">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
    </div>
</header>
