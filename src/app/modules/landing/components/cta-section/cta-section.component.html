<section class="py-20 bg-primary-600 dark:bg-primary-900 relative overflow-hidden">
  <!-- Background decoration elements -->
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute top-0 right-0 -mt-20 -mr-20 h-80 w-80 rounded-full bg-primary-500/30 dark:bg-primary-800/30 blur-3xl"></div>
    <div class="absolute bottom-0 left-0 -mb-20 -ml-20 h-80 w-80 rounded-full bg-primary-500/30 dark:bg-primary-800/30 blur-3xl"></div>
  </div>
  
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
    <div class="max-w-4xl mx-auto text-center">
      <!-- CTA content -->
      <h2 class="text-3xl sm:text-4xl font-bold text-white mb-6">
        {{ ctaData.title }}
      </h2>
      
      <p class="text-xl text-primary-100 mb-8 max-w-2xl mx-auto">
        {{ ctaData.subtitle }}
      </p>
      
      <!-- CTA buttons -->
      <div class="flex flex-col sm:flex-row justify-center gap-4 mb-12">
        <a [href]="ctaData.primaryButtonLink" target="_blank" rel="noopener noreferrer" class="cta-primary-button inline-flex items-center justify-center px-6 py-3 border border-transparent rounded-lg shadow-lg text-base font-medium text-primary-700 bg-white hover:bg-primary-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors duration-200">
          {{ ctaData.primaryButtonText }}
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </a>
        
        <a [href]="ctaData.secondaryButtonLink" class="inline-flex items-center justify-center px-6 py-3 border border-primary-300 rounded-lg shadow-sm text-base font-medium text-white hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-400 transition-colors duration-200">
          {{ ctaData.secondaryButtonText }}
        </a>
      </div>
      
      <!-- Browser compatibility -->
      <div class="bg-primary-700/50 dark:bg-primary-800/50 backdrop-blur-sm rounded-xl p-6 max-w-2xl mx-auto">
        <h3 class="text-lg font-medium text-white mb-4">Available for all major browsers</h3>
        
        <div class="flex flex-wrap justify-center gap-8">
          @for (browser of ctaData.browserIcons; track browser.name) {
            <div class="flex flex-col items-center">
              <div class="h-16 w-16 rounded-full bg-white/10 flex items-center justify-center mb-2 hover:bg-white/20 transition-colors duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path [attr.d]="browser.icon" />
                </svg>
              </div>
              <span class="text-sm text-white">{{ browser.name }}</span>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
  
  <!-- Wave decoration at the bottom -->
  <div class="absolute bottom-0 left-0 right-0">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 120" class="w-full h-auto fill-white dark:fill-neutral-800">
      <path d="M0,64L80,69.3C160,75,320,85,480,80C640,75,800,53,960,48C1120,43,1280,53,1360,58.7L1440,64L1440,120L1360,120C1280,120,1120,120,960,120C800,120,640,120,480,120C320,120,160,120,80,120L0,120Z"></path>
    </svg>
  </div>
</section>
