<!-- Main landing page container -->
<div class="min-h-screen bg-gradient-to-b from-neutral-50 to-neutral-100 dark:from-neutral-900 dark:to-neutral-800 text-neutral-900 dark:text-neutral-100 font-sans">
  
  <!-- Navigation header -->
  <header class="sticky top-0 z-50 bg-white/80 dark:bg-neutral-900/80 backdrop-blur-md shadow-sm">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center py-4">
        <!-- Logo -->
        <div class="flex items-center space-x-2">
          <svg class="h-8 w-8 text-primary-500" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="text-xl font-bold">Prompt-End</span>
        </div>
        
        <!-- Navigation links -->
        <nav class="hidden md:flex space-x-8">
          @for (link of navLinks; track link.name) {
            <a *ngIf="!link.isRouterLink" [href]="link.href" class="text-neutral-600 hover:text-primary-500 dark:text-neutral-300 dark:hover:text-primary-400 transition-colors duration-200">
              {{ link.name }}
            </a>
            <a *ngIf="link.isRouterLink" [routerLink]="link.href" class="text-neutral-600 hover:text-primary-500 dark:text-neutral-300 dark:hover:text-primary-400 transition-colors duration-200">
              {{ link.name }}
            </a>
          }
        </nav>
        
        <!-- CTA button -->
        <div>
          <a href="#install" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary-500 hover:bg-primary-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors duration-200">
            Install Now
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Hero section -->
  <app-hero-section></app-hero-section>
  
  <!-- Features section -->
  <app-features-section id="features"></app-features-section>
  
  <!-- Benefits section -->
  <app-benefits-section id="benefits"></app-benefits-section>
  
  <!-- CTA section -->
  <app-cta-section id="install"></app-cta-section>
  
  <!-- Testimonials section -->
  <app-testimonials-section id="testimonials"></app-testimonials-section>
  
  <!-- FAQ section -->
  <app-faq-section id="faq"></app-faq-section>
  
  <!-- Footer section -->
  <app-footer-section></app-footer-section>
</div>
