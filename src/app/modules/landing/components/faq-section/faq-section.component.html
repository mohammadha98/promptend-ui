<section class="py-20 bg-neutral-50 dark:bg-neutral-900">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Section header -->
    <div class="text-center max-w-3xl mx-auto mb-16">
      <h2 class="text-3xl sm:text-4xl font-bold text-neutral-900 dark:text-white mb-4">
        Frequently Asked Questions
      </h2>
      <p class="text-xl text-neutral-600 dark:text-neutral-300">
        Find answers to common questions about Prompt-End
      </p>
    </div>
    
    <!-- FAQ accordion -->
    <div class="max-w-3xl mx-auto">
      <div class="space-y-4">
        @for (faq of faqs; track faq.question; let i = $index) {
          <div class="faq-item bg-white dark:bg-neutral-800 rounded-lg shadow-sm overflow-hidden border border-neutral-200 dark:border-neutral-700">
            <!-- Question (accordion header) -->
            <!-- <button 
              (click)="toggleFaq(i)" 
              class="w-full text-left p-6 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-colors duration-200"
              [class.bg-primary-50]="faq.isOpen"
              [class.dark:bg-primary-900/20]="faq.isOpen"
            >
              <div class="flex justify-between items-center">
                <h3 class="text-lg font-medium text-neutral-900 dark:text-white">
                  {{ faq.question }}
                </h3>
                <svg 
                  xmlns="http://www.w3.org/2000/svg" 
                  class="h-5 w-5 text-neutral-500 dark:text-neutral-400 transition-transform duration-200" 
                  [class.transform]="faq.isOpen" 
                  [class.rotate-180]="faq.isOpen" 
                  viewBox="0 0 20 20" 
                  fill="currentColor"
                >
                  <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
              </div>
            </button>
             -->
            <!-- Answer (accordion content) -->
            <div 
              class="overflow-hidden transition-all duration-300 max-h-0" 
              [class.max-h-96]="faq.isOpen"
            >
              <div class="p-6 pt-0 text-neutral-600 dark:text-neutral-300 border-t border-neutral-200 dark:border-neutral-700">
                {{ faq.answer }}
              </div>
            </div>
          </div>
        }
      </div>
      
      <!-- Additional help -->
      <div class="mt-12 text-center p-6 bg-white dark:bg-neutral-800 rounded-lg shadow-sm border border-neutral-200 dark:border-neutral-700">
        <h3 class="text-lg font-medium text-neutral-900 dark:text-white mb-2">
          Still have questions?
        </h3>
        <p class="text-neutral-600 dark:text-neutral-300 mb-4">
          If you couldn't find the answer to your question, feel free to reach out to our support team.
        </p>
        <a href="mailto:support@prompt-end.com" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors duration-200">
          Contact Support
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-2" viewBox="0 0 20 20" fill="currentColor">
            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
          </svg>
        </a>
      </div>
    </div>
  </div>
</section>
