  <!-- Main Chat Area -->
  <div class="flex-1 max-w-xl mx-auto h-full flex flex-col">
    <!-- Chat Wrapper -->
    <div
      class="flex flex-col flex-1 bg-neutral-light w-full h-full shadow-md border border-gray-700">

      <!-- Header -->
      <div class="p-2 bg-gray-800 text-gray-200 text-sm font-semibold rounded-t-md">
        Promptend
      </div>

      <!-- Chat Messages Section -->
      <div id="chatContainer" class="flex-1 overflow-y-auto p-2 space-y-2">
        <!-- Bot Message -->
        <div class="flex items-start space-x-1">
          <div
            class="bg-gray-700 text-gray-200 px-3 py-2 rounded-md max-w-[14rem] shadow-sm text-xs">
            Hello! How can I assist you today? 😊
          </div>
        </div>

        <!-- User Message -->
        <div class="flex justify-end">
          <div
            class="bg-gray-500 text-gray-200 px-3 py-2 rounded-md max-w-[14rem] shadow-sm text-xs">
            Hi! Can you help me with Tailwind CSS?
          </div>
        </div>
      </div>

      <!-- Input Section -->
      <form id="chatForm" class="flex items-center p-2 bg-gray-900 border-t border-gray-800 shadow-sm">
        <!-- Input Field -->
        <div class="relative flex-1">
          <input id="messageInput" type="text" placeholder="Type..."
            class="w-full p-2 pl-8 pr-2 bg-gray-800 text-gray-200 border border-gray-700 rounded-full placeholder:text-gray-500 focus:outline-none focus:ring-1 focus:ring-blue-500 transition-all duration-200 text-xs" />
          <!-- Icon inside input -->
          <div class="absolute inset-y-0 left-2 flex items-center">
            <svg class="w-3 h-3 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M8 16l4-4m0 0l4-4m-4 4v12" />
            </svg>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit"
          class="ml-2 bg-gradient-to-r from-blue-500 to-indigo-600 text-white px-3 py-1 rounded-full font-medium shadow-sm hover:shadow-md transform hover:scale-105 transition-transform duration-200 ease-in-out text-xs">
          Send
        </button>
      </form>

    </div>
  </div>

  <!-- Right Sidebar -->
  <div class="w-16 sm:w-24 bg-gray-800 flex flex-col items-center py-4 space-y-6">
 
    <a href="#" class="text-gray-400 hover:text-white">
      <svg class="w-5 h-5 sm:w-6 sm:h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"

          d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </a>
